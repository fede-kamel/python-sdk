[project]
name = "mcp-admission-gate"
version = "0.1.0"
description = "MCP server example gating filesystem tool calls through a real ServerMiddleware admission decision"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Model Context Protocol a Series of LF Projects, LLC." }]
keywords = ["mcp", "llm", "middleware", "admission-control", "governance"]
license = { text = "MIT" }
dependencies = ["mcp", "tulip-agents[openai]"]

[project.scripts]
mcp-admission-gate = "mcp_admission_gate.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_admission_gate"]

[tool.pyright]
include = ["mcp_admission_gate"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = ["pyright>=1.1.378", "pytest>=8.3.3", "ruff>=0.6.9"]
